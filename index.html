<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8fafc">
  <title>Sangat Flyer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dosis:wght@400;500;600;700&family=Roboto+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #f5fdff;
      --ink: #063248;
      --muted: #444;
      --line: #9eced8;
      --accent: #dffaff;
      --white: #fff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: "Roboto Condensed", sans-serif;
    }

    .topbar {
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px max(24px, calc((100vw - 1050px) / 2));
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 16px;
      font-weight: 700;
    }

    .brand-mark {
      display: none;
    }

    .topbar-note {
      color: var(--muted);
      font-size: 12px;
    }

    main {
      display: grid;
      grid-template-columns: minmax(270px, 320px) minmax(320px, 1fr);
      gap: 24px;
      max-width: 1100px;
      margin: 0 auto;
      padding: 36px 24px;
      align-items: start;
    }

    .editor {
      padding: 28px;
      border: 1px solid #f3f4f6;
      border-radius: 12px;
      background: var(--white);
      box-shadow: 0 4px 12px rgba(15, 23, 42, .08);
    }

    .eyebrow {
      margin: 0 0 13px;
      color: #728074;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font: 700 34px/1.15 "Dosis", sans-serif;
      letter-spacing: 0;
    }

    .intro {
      margin: 14px 0 34px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    form { display: grid; gap: 19px; }

    label {
      display: grid;
      gap: 8px;
      color: #063248;
      font-size: 12px;
      font-weight: 700;
    }

    input, select {
      width: 100%;
      height: 46px;
      padding: 0 12px;
      border: 1px solid #9eced8;
      border-radius: 4px;
      outline: none;
      background: var(--white);
      color: var(--ink);
      font: 400 14px "Roboto Condensed", sans-serif;
    }

    input:focus, select:focus { border-color: #3697ab; box-shadow: 0 0 0 3px rgba(54, 151, 171, .18); }
    input::placeholder { color: #969e96; }

    .time-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .time-fields label { min-width: 0; }

    .form-error {
      min-height: 16px;
      margin: -8px 0 -8px;
      color: #a34235;
      font-size: 12px;
    }

    button {
      min-height: 46px;
      padding: 0 16px;
      border: 0;
      border-radius: 4px;
      cursor: pointer;
      font: 700 13px "Roboto Condensed", sans-serif;
      transition: background-color 160ms ease, transform 160ms ease;
    }

    button:hover { transform: translateY(-1px); }
    button:focus-visible { outline: 3px solid #52a2b1; outline-offset: 3px; }

    .generate-button { background: #3697ab; color: var(--white); }
    .generate-button:hover { background: #257f92; }

    .preview-area {
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 17px;
      padding: 24px;
      border-radius: 12px;
      background: var(--white);
      box-shadow: 0 4px 12px rgba(15, 23, 42, .08);
    }

    .preview-heading {
      display: flex;
      width: min(100%, 600px);
      align-items: center;
      justify-content: space-between;
      color: #063248;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .preview-heading span:last-child { font-weight: 400; letter-spacing: 0; text-transform: none; }

    canvas {
      display: block;
      width: min(100%, 600px);
      height: auto;
      aspect-ratio: 1;
      border-radius: 8px;
      background: var(--paper);
      box-shadow: 0 4px 12px rgba(15, 23, 42, .12);
    }

    .preview-actions {
      display: flex;
      width: min(100%, 600px);
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .download-button { background: #3697ab; color: var(--white); }
    .download-button:hover { background: #257f92; }
    .preview-actions button { min-height: 40px; font-size: 12px; }
    .action-group { display: flex; gap: 8px; }
    .status { color: var(--muted); font-size: 11px; }

    @media (max-width: 760px) {
      .topbar { height: 58px; padding: 0 20px; }
      .topbar-note { font-size: 11px; }
      main { grid-template-columns: 1fr; }
      main { padding: 24px 16px; }
      .editor { padding: 24px; }
      h1 { font-size: 34px; }
      .intro { margin-bottom: 24px; }
      form { gap: 15px; }
      .preview-area { padding: 18px; }
    }

    @media print {
      @page { size: 4in 4in; margin: 0; }
      body { min-width: 0; min-height: 0; background: #fff; }
      .topbar, .editor, .preview-heading, .preview-actions { display: none !important; }
      main { display: block; min-height: 0; }
      .preview-area { display: block; padding: 0; background: none; }
      canvas { width: 4in; height: 4in; border-radius: 0; box-shadow: none; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"> Weekly Seattle Sangat Flyer Generator</div>
  </header>

  <main>
    <section class="editor" aria-labelledby="page-title">
      <h1 id="page-title">Set the details.</h1>
      <p class="intro">Add the date, time and place.</p>

      <form id="flyer-form">
        <label for="event-day">Day
          <select id="event-day" name="day">
            <option value="wednesday">Wednesday</option>
            <option value="saturday">Saturday</option>
          </select>
        </label>

        <label for="event-date">Date
          <input id="event-date" name="date" type="date" required>
        </label>

        <div class="time-fields">
          <label for="from-time">From
            <input id="from-time" name="from" type="time" required>
          </label>
          <label for="to-time">To
            <input id="to-time" name="to" type="time" required>
          </label>
        </div>

        <label for="event-location">Location
          <input id="event-location" name="location" type="text" maxlength="64" placeholder="Gurdwara name or address" autocomplete="street-address" required>
        </label>

        <p id="form-error" class="form-error" role="alert" aria-live="polite"></p>
      </form>
    </section>

    <section class="preview-area" aria-label="Flyer preview">
      <div class="preview-heading"><span>Flyer preview</span></div>
      <canvas id="flyer-canvas" width="1080" height="1080" role="img" aria-label="Square sangat flyer preview"></canvas>
      <div class="preview-actions">
        <div class="action-group">
          <button class="download-button" id="download-button" type="button">Download PNG</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const form = document.querySelector("#flyer-form");
    const dayInput = document.querySelector("#event-day");
    const dateInput = document.querySelector("#event-date");
    const fromInput = document.querySelector("#from-time");
    const toInput = document.querySelector("#to-time");
    const locationInput = document.querySelector("#event-location");
    const canvas = document.querySelector("#flyer-canvas");
    const context = canvas.getContext("2d");
    const errorMessage = document.querySelector("#form-error");
    const status = document.querySelector("#status");
    const background = new Image();
    const dodraLogo = new Image();
    let imageReady = false;
    let logoReady = false;

    function updateStatus(message) {
      if (status) status.textContent = message;
    }

    background.addEventListener("load", () => {
      imageReady = true;
      drawFlyer();
    });
    background.src = "sangat-background.jpg";
    dodraLogo.addEventListener("load", () => {
      logoReady = true;
      drawFlyer();
    });
    dodraLogo.src = "dodra-logo.jpg";
    document.fonts.ready.then(drawFlyer);

    const schedules = {
      wednesday: { weekday: 3, from: "18:00", to: "20:00" },
      saturday: { weekday: 6, from: "15:30", to: "19:30" }
    };

    function daysUntilNext(weekday) {
      const today = new Date();
      const difference = (weekday - today.getDay() + 7) % 7;
      return difference === 0 ? 7 : difference;
    }

    function nextDateForWeekday(weekday) {
      const today = new Date();
      const date = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      date.setDate(date.getDate() + daysUntilNext(weekday));
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function setSchedule(day) {
      const schedule = schedules[day];
      if (!schedule) return;
      dateInput.value = nextDateForWeekday(schedule.weekday);
      fromInput.value = schedule.from;
      toInput.value = schedule.to;
      drawFlyer();
      updateStatus("Schedule updated.");
    }

    function formattedTime(value) {
      if (!value) return "ADD THE TIME";
      const [hours, minutes] = value.split(":").map(Number);
      const suffix = hours >= 12 ? "PM" : "AM";
      const twelveHour = hours % 12 || 12;
      return `${twelveHour}:${String(minutes).padStart(2, "0")} ${suffix}`;
    }

    function drawTrackedText(text, x, y, spacing, color) {
      context.fillStyle = color;
      for (const character of text) {
        context.fillText(character, x, y);
        x += context.measureText(character).width + spacing;
      }
    }

    function wrapText(text, maxWidth) {
      const lines = [];
      let line = "";
      for (const word of text.split(/\s+/)) {
        const candidate = line ? `${line} ${word}` : word;
        if (line && context.measureText(candidate).width > maxWidth) {
          lines.push(line);
          line = word;
        } else {
          line = candidate;
        }
      }
      if (line) lines.push(line);
      return lines;
    }

    function drawFlyer() {
      const width = canvas.width;
      const height = canvas.height;
      context.clearRect(0, 0, width, height);
      context.fillStyle = "#f8fafc";
      context.fillRect(0, 0, width, height);

      if (imageReady) {
        const scale = Math.max(width / background.width, height / background.height);
        const imageWidth = background.width * scale;
        const imageHeight = background.height * scale;
        context.save();
        context.beginPath();
        context.rect(0, 0, width, height);
        context.clip();
        context.drawImage(background, (width - imageWidth) / 2, (height - imageHeight) / 2, imageWidth, imageHeight);
        context.restore();
      }

      context.fillStyle = "rgba(248, 250, 252, .36)";
      context.fillRect(0, 0, width, height);

      context.fillStyle = "rgba(255, 255, 255, .82)";
      context.fillRect(100, 60, 880, 132);
      context.fillStyle = "#3697ab";
      context.fillRect(500, 84, 80, 4);
      if (logoReady) {
        for (const centerX of [172, 908]) {
          context.save();
          context.beginPath();
          context.arc(centerX, 126, 48, 0, Math.PI * 2);
          context.clip();
          context.drawImage(dodraLogo, centerX - 48, 78, 96, 96);
          context.restore();
          context.strokeStyle = "#9eced8";
          context.lineWidth = 3;
          context.beginPath();
          context.arc(centerX, 126, 48, 0, Math.PI * 2);
          context.stroke();
        }
      }
      context.font = '700 54px "Dosis", sans-serif';
      context.fillStyle = "#063248";
      context.textAlign = "center";
      context.fillText("Seattle Weekly Sangat", width / 2, 157, 820);
      context.textAlign = "start";

      context.fillStyle = "rgba(255, 255, 255, .82)";
      context.fillRect(100, 420, width - 200, 640);

      const dateValue = dateInput.value
        ? new Date(`${dateInput.value}T12:00:00`).toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" }).toUpperCase()
        : "ADD THE DATE";
      const start = formattedTime(fromInput.value);
      const end = formattedTime(toInput.value);
      const eventLocation = locationInput.value.trim() || "ADD THE LOCATION";
      const valueFont = '600 48px "Roboto Condensed", sans-serif';

      context.font = '700 22px "Dosis", sans-serif';
      drawTrackedText("DATE", 156, 510, 2, "#444444");
      context.font = valueFont;
      context.fillStyle = "#063248";
      context.fillText(dateValue, 156, 568, 768);

      context.strokeStyle = "#9eced8";
      context.lineWidth = 2;
      context.beginPath();
      context.moveTo(156, 615);
      context.lineTo(924, 615);
      context.stroke();

      context.font = '700 22px "Dosis", sans-serif';
      drawTrackedText("TIME", 156, 665, 2, "#444444");
      context.font = valueFont;
      context.fillStyle = "#063248";
      context.fillText(`${start}  –  ${end}`, 156, 723, 768);

      context.strokeStyle = "#9eced8";
      context.beginPath();
      context.moveTo(156, 790);
      context.lineTo(924, 790);
      context.stroke();

      context.font = '700 22px "Dosis", sans-serif';
      drawTrackedText("LOCATION", 156, 850, 2, "#444444");
      context.font = valueFont;
      context.fillStyle = "#063248";
      wrapText(eventLocation, 768).slice(0, 3).forEach((line, index) => {
        context.fillText(line, 156, 908 + index * 52, 768);
      });
    }

    function hasDetails() {
      return Boolean(dateInput.value && fromInput.value && toInput.value && locationInput.value.trim());
    }

    dayInput.addEventListener("change", () => setSchedule(dayInput.value));
    const nextDay = daysUntilNext(schedules.wednesday.weekday) < daysUntilNext(schedules.saturday.weekday)
      ? "wednesday"
      : "saturday";
    dayInput.value = nextDay;
    setSchedule(nextDay);

    function refreshFlyer() {
      errorMessage.textContent = "";
      drawFlyer();
      updateStatus("Flyer updated.");
    }

    form.addEventListener("input", (event) => {
      if (event.target !== dayInput) refreshFlyer();
    });

    form.addEventListener("change", (event) => {
      if (event.target !== dayInput) refreshFlyer();
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      errorMessage.textContent = "";
      if (fromInput.value && toInput.value && fromInput.value >= toInput.value) {
        errorMessage.textContent = "The end time must be later than the start time.";
        toInput.focus();
      }
    });

    document.querySelector("#download-button").addEventListener("click", () => {
      if (!hasDetails()) {
        updateStatus("Add all four details before downloading.");
        form.reportValidity();
        return;
      }
      if (fromInput.value >= toInput.value) {
        errorMessage.textContent = "The end time must be later than the start time.";
        toInput.focus();
        return;
      }
      drawFlyer();
      canvas.toBlob((blob) => {
        if (!blob) {
          updateStatus("The flyer could not be downloaded. Please try again.");
          return;
        }
        const link = document.createElement("a");
        link.download = "sangat-flyer.png";
        const downloadUrl = URL.createObjectURL(blob);
        link.href = downloadUrl;
        link.click();
        setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
        updateStatus("PNG downloaded.");
      }, "image/png");
    });

    drawFlyer();
  </script>
</body>
</html>
